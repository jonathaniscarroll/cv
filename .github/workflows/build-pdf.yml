name: Build CV PDF

on:
  push:
    branches: [main]
    paths: [index.html, build-pdf.mjs]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node build-pdf.mjs
      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Jonathan-Carroll-CV.pdf
          git diff --cached --quiet || (git commit -m "Rebuild CV PDF from index.html [skip ci]" && git push)
